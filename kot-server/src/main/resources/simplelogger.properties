# =========================================================
# SLF4J Simple Logger Configuration
# =========================================================
# 说明：
# - 作为 kotlin-logging 的轻量运行时后端
# - 当前阶段替代 Log4j2 / Logback，统一输出到控制台
# - OTel 负责观测链路（trace 等），应用日志仍通过 SLF4J facade 输出

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.cacheOutputStream=true

# Micronaut / Netty
org.slf4j.simpleLogger.log.io.micronaut=info
org.slf4j.simpleLogger.log.io.micronaut.context.env=info
org.slf4j.simpleLogger.log.io.netty=info

# 业务包
org.slf4j.simpleLogger.log.com.arrocean.dev=debug
org.slf4j.simpleLogger.log.com.arrocean.dev.module.system.infrastructure.persistence=debug


