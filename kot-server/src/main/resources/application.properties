# =========================================================
# 1. Application Identity
# =========================================================
# 应用唯一标识（用于日志、监控、分布式场景）
micronaut.application.name=kot-cloud

# =========================================================
# 2. Server Bootstrap
# =========================================================
# system-server 独立启动端口，避免与其它服务冲突
micronaut.server.port=1164
# 禁用 Micronaut 默认的异常处理
micronaut.server.log-handled-exceptions=false

# =========================================================
# 3. Persistence / Database (Micronaut Data JDBC)
# =========================================================
# 数据库方言（全局默认）
micronaut.data.jdbc.dialect=POSTGRES

# -------- Datasource : default --------
datasources.default.driverClassName=org.postgresql.Driver
datasources.default.dialect=POSTGRES

# 生产环境建议通过环境变量覆盖
datasources.default.url=${JDBC_URL:`jdbc:postgresql://127.0.0.1:5432/kot_cloud`}
datasources.default.username=${JDBC_USER:postgres}
datasources.default.password=${JDBC_PASSWORD:postgres}

# -------- HikariCP Pool Settings --------
datasources.default.maximumPoolSize=10
datasources.default.minimumIdle=1
datasources.default.autoCommit=true

redis.uri=${REDIS_URI:`redis://127.0.0.1:6379/0`}

# =========================================================
# 4. Web / HTTP Layer
# =========================================================

# -------- Static Resources --------
# 是否启用静态资源（Swagger UI / 前端资源等）
micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:static

# OpenAPI 生成文件
micronaut.router.static-resources.swagger.enabled=true
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger

# -------- HTTP Client --------
micronaut.http.client.read-timeout=30s
micronaut.http.client.connect-timeout=10s


# =========================================================
# 5. Serialization & Validation
# =========================================================

# -------- Jackson --------
#jackson.serialization.write-dates-as-timestamps=false

# -------- Validation --------
micronaut.validation.enabled=true


# =========================================================
# 6. Security
# =========================================================

# -------- Micronaut Security --------
micronaut.security.enabled=true
micronaut.security.authentication=bearer
micronaut.security.filter.enabled=true
micronaut.security.token.enabled=true
micronaut.security.token.bearer.enabled=true
micronaut.security.token.jwt.enabled=true
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false

# 使用共享密钥签发 / 校验 JWT
# 生产环境请务必通过环境变量覆盖，且密钥长度不少于 32 字节
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:`change-this-secret-at-least-32-bytes-long`}

# -------- Security Whitelist --------
# 说明：
# - 优先使用 URL 白名单声明匿名入口，避免仅靠 @Secured 注解导致规则分散
# - Controller 上的 @Secured(SecurityRule.IS_ANONYMOUS) 仍保留，作为第二道防线
# - 若后续有更多业务模块开放匿名接口，请继续在这里集中维护
micronaut.security.intercept-url-map[0].pattern=/v1/admin-api/system/auth/login
micronaut.security.intercept-url-map[0].http-method=POST
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()

# OpenAPI / Swagger（按需启用；生产环境建议结合环境配置进一步收紧）
micronaut.security.intercept-url-map[1].pattern=/swagger/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/swagger-ui
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[3].access[0]=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/v3/api-docs/**
micronaut.security.intercept-url-map[4].access[0]=isAnonymous()

# 健康检查（若当前未启用管理端点，这些规则不会产生副作用）
micronaut.security.intercept-url-map[5].pattern=/health
micronaut.security.intercept-url-map[5].access[0]=isAnonymous()
micronaut.security.intercept-url-map[6].pattern=/health/**
micronaut.security.intercept-url-map[6].access[0]=isAnonymous()
micronaut.security.intercept-url-map[7].pattern=/actuator
micronaut.security.intercept-url-map[7].access[0]=isAnonymous()
micronaut.security.intercept-url-map[8].pattern=/actuator/**
micronaut.security.intercept-url-map[8].access[0]=isAnonymous()

# -------- Project Security --------
kot.security.access-token-expire-seconds=${ACCESS_TOKEN_EXPIRE_SECONDS:1200}
kot.security.refresh-token-expire-seconds=${REFRESH_TOKEN_EXPIRE_SECONDS:604800}
kot.security.default-client-id=${SECURITY_DEFAULT_CLIENT_ID:default}
kot.security.redis.key-prefix=${SECURITY_REDIS_KEY_PREFIX:`kot:security`}
#kot.security.password.encoder=${PASSWORD_ENCODER:argon2id}
#kot.security.password.encoder=${PASSWORD_ENCODER:bcrypt}
kot.security.password.encoder=${PASSWORD_ENCODER:pbkdf2}

# Argon2id（性能较差，但安全系数高）
kot.security.password.argon2id.salt-length=${PASSWORD_ARGON2ID_SALT_LENGTH:16}
kot.security.password.argon2id.hash-length=${PASSWORD_ARGON2ID_HASH_LENGTH:32}
kot.security.password.argon2id.memory-kb=${PASSWORD_ARGON2ID_MEMORY_KB:65536}
kot.security.password.argon2id.iterations=${PASSWORD_ARGON2ID_ITERATIONS:3}
kot.security.password.argon2id.parallelism=${PASSWORD_ARGON2ID_PARALLELISM:1}

# BCrypt（综合较好）
kot.security.password.bcrypt.rounds=${PASSWORD_BCRYPT_ROUNDS:10}

# PBKDF2-HMAC-SHA256（兼容较好）
kot.security.password.pbkdf2.iterations=${PASSWORD_PBKDF2_ITERATIONS:185000}
kot.security.password.pbkdf2.hash-length=${PASSWORD_PBKDF2_HASH_LENGTH:32}
kot.security.password.pbkdf2.salt-length=${PASSWORD_PBKDF2_SALT_LENGTH:16}


# =========================================================
# 7. Observability / Logging
# =========================================================

# -------- OpenTelemetry --------
# 说明：
# - 当前阶段优先接入 OTel 观测基础设施
# - 应用日志通过 kotlin-logging + SLF4J Simple 输出到控制台
# - Trace 导出器默认使用 logging（控制台）模式，便于本地验证
otel.service.name=${OTEL_SERVICE_NAME:`kot-cloud`}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:logging}
otel.metrics.exporter=${OTEL_METRICS_EXPORTER:none}
otel.logs.exporter=${OTEL_LOGS_EXPORTER:none}

# -------- Logging Backend --------
# 运行时后端已切换为 slf4j-simple，格式与包级别见 classpath:simplelogger.properties
