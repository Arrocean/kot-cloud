# =========================================================
# Log4j2 配置（对应你的 logback.xml）
# 文件名：log4j2.properties
# =========================================================

# 类似 logback 的 scanPeriod：监控配置变更（秒）
monitorInterval = 30
status = warn
name = kot-server-log4j2

# -------------------------
# 通用属性（支持 env / sys 默认值）
# -------------------------
property.APP_NAME = ${env:APP_NAME:-kot-server}
property.LOG_DIR  = ${env:LOG_DIR:-${sys:user.dir}/logs}
property.LOG_FILE = ${env:LOG_FILE:-${LOG_DIR}/${APP_NAME}.log}

property.CONSOLE_LOG_PATTERN = >>>LOG4J2<<< %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %highlight{%-5level} %style{%logger{50}:%line}{cyan} - %msg%n
property.FILE_LOG_PATTERN    = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{50}:%line - %msg%n

# -------------------------
# Appenders
# -------------------------

# 1) 控制台
appender.console.type = Console
appender.console.name = STDOUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${CONSOLE_LOG_PATTERN}
# 强制在控制台输出 ANSI 颜色（避免被自动判断为不支持 ANSI）
appender.console.layout.disableAnsi = false
appender.console.layout.noConsoleNoAnsi = false

# 2) 文件滚动：按天 + 按大小（对应 SizeAndTimeBasedRollingPolicy）
appender.file.type = RollingFile
appender.file.name = FILE
appender.file.fileName = ${LOG_FILE}
# 例如：~/logs/kot-server.log.2025-12-21.0.log
appender.file.filePattern = ${LOG_FILE}.%d{yyyy-MM-dd}.%i.log

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${FILE_LOG_PATTERN}

# 触发策略：时间 + 大小
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true

appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB

# 保留历史：maxHistory=30（Log4j2 用 max）
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 30

# （可选）totalSizeCap 类似能力：Log4j2 需要 Delete Action，properties 写起来很长。
# 如果你确实要 2GB 总量上限，我可以再给你补一段“Delete + IfAccumulatedFileSize”的配置块。

# 3) 异步写文件（对应 logback AsyncAppender）
appender.async.type = Async
appender.async.name = ASYNC
appender.async.bufferSize = 512
# 不丢日志：Log4j2 AsyncAppender 没有 1:1 的 discardingThreshold，
# 但你可以通过队列 + 阻塞策略降低丢弃概率。这里用默认阻塞行为更接近“不丢”。
appender.async.appenderRef.file.type = AppenderRef
appender.async.appenderRef.file.ref = FILE

# 重要：你 pattern 里用了 %line（行号），异步/性能会受影响。
# 想要行号正确，必须 includeLocation=true（代价是更慢）。
appender.async.includeLocation = true

# -------------------------
# Loggers
# -------------------------

# 精确屏蔽：只关掉“回显配置”的日志
logger.mnconfig.name = io.micronaut.logging.PropertiesLoggingLevelsConfigurer
logger.mnconfig.level = error
logger.mnconfig.additivity = false

# Micronaut / Netty 常用
logger.micronaut.name = io.micronaut
logger.micronaut.level = info

logger.netty.name = io.netty
logger.netty.level = info

# 你的业务包（示例）
logger.biz.name = com.whitesprite.dev
logger.biz.level = debug

# -------------------------
# Root
# -------------------------
rootLogger.level = info
rootLogger.appenderRefs = stdout, async
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.async.ref = ASYNC
