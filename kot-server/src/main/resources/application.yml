# Micronaut 配置
micronaut:
  application:
    name: kot-server
  server:
    # system-server 独立启动端口，避免与其它服务冲突
    port: 1164
  data:
    jdbc:
      # 一般 default 即可；明确写出来便于脚手架读者理解
      dialect: POSTGRES

# Micronaut Data JDBC + Hikari 数据源配置
# 建议：不要在这里写死密码；用环境变量覆盖（application-dev.yml 可写本地密码）
datasources:
  default:
    driverClassName: org.postgresql.Driver
    # 生产建议由环境变量注入
    url: ${JDBC_URL:`jdbc:postgresql://127.0.0.1:5432/kot_cloud`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    dialect: POSTGRES

    # Hikari 常用参数（可按需调整）
    maximumPoolSize: 10
    minimumIdle: 1
    autoCommit: true
