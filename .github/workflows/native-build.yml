name: Build and deploy native image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kot-server-native-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy kot-server
    runs-on: [self-hosted, Linux, X64, NO1]
    timeout-minutes: 60

    env:
      DEPLOY_DIR: /home/ubuntu/Kot-Cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Verify GraalVM version
        shell: bash
        run: |
          set -euo pipefail
          native-image --version
          native-image --version | grep -F "25.1"

      - name: Cache Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          distribution_dir="${HOME}/.gradle/wrapper-downloads"
          distribution_file="${distribution_dir}/gradle-9.6.1-all.zip"
          mkdir -p "${distribution_dir}"
          if [[ ! -f "${distribution_file}" ]]; then
            curl --fail --location --continue-at - \
              --retry 10 --retry-all-errors --retry-delay 2 \
              --output "${distribution_file}.part" \
              https://mirrors.cloud.tencent.com/gradle/gradle-9.6.1-all.zip
            mv "${distribution_file}.part" "${distribution_file}"
          fi
          sed -i \
            -e "s#^distributionUrl=.*#distributionUrl=file\\:${distribution_file}#" \
            -e 's/^networkTimeout=.*/networkTimeout=60000/' \
            -e 's/^retries=.*/retries=3/' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Build native image
        shell: bash
        run: bash gradlew --no-daemon :kot-server:nativeCompile

      - name: Deploy native image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_file="kot-server/build/native/nativeCompile/kot-server"
          test -x "${source_file}"
          install -d "${DEPLOY_DIR}"
          install -m 0755 "${source_file}" "${DEPLOY_DIR}/kot-server.new"
          mv -f "${DEPLOY_DIR}/kot-server.new" "${DEPLOY_DIR}/kot-server"

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: kot-server-linux-x64
          path: kot-server/build/native/nativeCompile/kot-server
          if-no-files-found: error
          retention-days: 7
