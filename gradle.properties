kotlin.code.style=official

# ====== Gradle 自身 ======
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

# Micronaut OpenAPI currently fails during KSP aggregating output generation
# when incremental PSI state is enabled.
ksp.incremental=false

# 给 Gradle JVM 留足空间（别和 native-image 抢）
org.gradle.jvmargs=-Xmx512m -Xms128m

# ====== 自定义 native 限制（给 build.gradle 用） ======
native.image.xmx=8G
native.image.xms=512M

# 自动检测本机或 CI 提供的 GraalVM/JDK
org.gradle.java.installations.auto-detect=true
