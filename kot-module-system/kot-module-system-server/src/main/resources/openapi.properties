# Apifox imports OpenAPI 3.0 nullable/ref schemas more reliably than its 3.1 conversion path.
# This is a compile-time micronaut-openapi configuration file and is unrelated to KSP incrementality.
micronaut.openapi.openapi31.enabled=false
micronaut.openapi.filename=kot-cloud-api-1.0.0.yml
micronaut.openapi.schema.name.separator.generic=Of
micronaut.openapi.schema.name.separator.inner-class=.
micronaut.openapi.operation.duplicate-resolution=error
micronaut.openapi.schema.duplicate-resolution=error
